# PKHeX Web on nginx: the response headers, cache rules and compression that wwwroot/_headers gives Cloudflare Pages.
# Keep it in step with _headers; HostingSnippetsTests fails when the policies or patterns here drift from it.
#
# The two maps belong in the http block (for example in conf.d/), the server block wherever you serve the site.
# The patterns match the end of the path, so the same maps work for a site at / and under a subpath such as /PKHeX/.

# Fingerprinted files never change under the same name and are cached for good; everything else is revalidated before reuse.
# blazor.webassembly.js and dotnet.js (which holds the boot manifest) are not fingerprinted, so only fingerprinted shapes are listed.
map $uri $pkhex_cache_control {
    default                                                  "no-cache";
    "~/_framework/[^/]+\.(wasm|dat)$"                         "public, max-age=31536000, immutable";
    "~/_framework/dotnet\.[^/]+\.js$"                         "public, max-age=31536000, immutable";
    "~/sprites/(pokemon\.[^/]+\.png|sprites\.[^/]+\.css)$"    "public, max-age=31536000, immutable";
}

# The app's policy everywhere; the license and notices, shown by the browser's own text viewer, get one that allows only its inline style and the site's icon.
map $uri $pkhex_csp {
    default                                                  "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'";
    "~/(LICENSE\.txt|THIRD-PARTY-NOTICES\.md|licenses/[^/]+)$" "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; frame-ancestors 'none'";
}

server {
    listen 80;
    # The published wwwroot. Deploy each release to its own directory and switch this path (or a symlink to it) in one step.
    root /srv/pkhex-web/current;
    index index.html;

    # application/wasm is in the mime.types of nginx 1.21.5 and later; markdown is not. A types block replaces the inherited table,
    # so the standard one is included first and markdown added to it.
    include mime.types;
    types {
        text/markdown md;
    }
    # Anything else, such as the runtime's ICU data (_framework/*.dat), is binary. Without this the http block's default_type applies,
    # which is text/plain when it sets none.
    default_type application/octet-stream;
    charset utf-8;
    charset_types text/plain text/markdown text/css text/javascript application/javascript application/json;

    # Serve the precompressed .gz copies the publish includes. The .br copies need the ngx_brotli module.
    gzip_static on;
    gzip_vary on;
    # brotli_static on;

    # A missing file is a 404 with the not-found page, never the app (for a subpath: /PKHeX/404.html).
    error_page 404 /404.html;

    # The rules file is for hosts that read it; it is not part of the site.
    location ~ (^|/)_headers$ {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Content-Security-Policy $pkhex_csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control $pkhex_cache_control always;
    }
}
