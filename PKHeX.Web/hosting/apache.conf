# PKHeX Web on Apache httpd 2.4: the response headers, cache rules and compression that wwwroot/_headers gives Cloudflare Pages.
# Keep it in step with _headers; HostingSnippetsTests fails when the policies or patterns here drift from it.
#
# Use it as .htaccess next to index.html (needs AllowOverride FileInfo Indexes Options), or inside the <Directory> of the published wwwroot.
# It needs mod_mime, mod_headers and mod_rewrite. The patterns match the end of the path, so it works at / and under a subpath such as /PKHeX/.

DirectoryIndex index.html
Options -Indexes

# Types. A precompressed copy keeps its asset's type (a.js.br is JavaScript), with the content coding from its last extension.
AddType application/wasm .wasm
AddType text/javascript .js
AddType text/markdown .md
# The runtime's ICU data; Apache 2.4 sends no Content-Type for an extension it does not know.
AddType application/octet-stream .dat
AddCharset utf-8 .txt .md
RemoveType .br .gz
AddEncoding br .br
AddEncoding gzip .gz

RewriteEngine On

# The rules file is for hosts that read it; it is not part of the site.
RewriteRule (^|/)_headers$ - [R=404,L]

# Serve the precompressed copy the browser accepts: Brotli, then gzip.
RewriteCond %{HTTP:Accept-Encoding} \bbr\b
RewriteCond %{REQUEST_FILENAME}.br -f
RewriteRule ^(.+)$ $1.br [L]
RewriteCond %{HTTP:Accept-Encoding} \bgzip\b
RewriteCond %{REQUEST_FILENAME}.gz -f
RewriteRule ^(.+)$ $1.gz [L]

# The response depends on Accept-Encoding. mod_deflate leaves a response that already has a content coding alone, so the copies are not compressed twice.
Header append Vary Accept-Encoding

# The app's policy, no sniffing, no referrer, and revalidation before reuse, on every response.
Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"
Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "no-referrer"
Header always set Cache-Control "no-cache"

# Fingerprinted files never change under the same name and are cached for good. blazor.webassembly.js and dotnet.js (which holds the
# boot manifest) are not fingerprinted, so only fingerprinted shapes are listed. After the rewrite above the path may end in .br or .gz.
<If "%{REQUEST_URI} =~ m#/_framework/[^/]+\.(wasm|dat)(\.br|\.gz)?$#">
    Header always set Cache-Control "public, max-age=31536000, immutable"
</If>
<If "%{REQUEST_URI} =~ m#/_framework/dotnet\.[^/]+\.js(\.br|\.gz)?$#">
    Header always set Cache-Control "public, max-age=31536000, immutable"
</If>
<If "%{REQUEST_URI} =~ m#/sprites/(pokemon\.[^/]+\.png|sprites\.[^/]+\.css)(\.br|\.gz)?$#">
    Header always set Cache-Control "public, max-age=31536000, immutable"
</If>

# The license and notices, shown by the browser's own text viewer, get a policy that allows only its inline style and the site's icon.
<If "%{REQUEST_URI} =~ m#/(LICENSE\.txt|THIRD-PARTY-NOTICES\.md|licenses/[^/]+)(\.br|\.gz)?$#">
    Header always set Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; frame-ancestors 'none'"
</If>

# A missing file is a 404 with the not-found page, never the app (for a subpath: /PKHeX/404.html).
ErrorDocument 404 /404.html
